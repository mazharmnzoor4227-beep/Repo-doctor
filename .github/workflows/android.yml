name: Build RepoPilot APK

on:
  push:
    branches: [ "main", "feat/**", "fix/**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Termux bridge safety tests
        run: bash termux-bridge/tests/test_bridge.sh

      - name: Android unit tests
        run: ./gradlew --no-daemon --max-workers=2 testDebugUnitTest

      - name: Android lint
        run: ./gradlew --no-daemon --max-workers=2 lintDebug

      - name: Build debug APK
        run: ./gradlew --no-daemon --max-workers=2 assembleDebug

      - name: Upload RepoPilot APK
        uses: actions/upload-artifact@v4
        with:
          name: RepoPilot-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
