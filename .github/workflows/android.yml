name: Build RepoPilot APK

on:
  push:
    branches: [ "main", "feat/**", "fix/**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0" >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Core pure Kotlin tests
        run: |
          kotlinc app/src/main/java/com/repopilot/app/core/Core.kt tools/core-tests.kt -include-runtime -d /tmp/repopilot-core.jar
          java -jar /tmp/repopilot-core.jar
      - name: Termux bridge safety tests
        run: bash termux-bridge/tests/test_bridge.sh
      - name: Android unit tests
        run: gradle --no-daemon --max-workers=2 testDebugUnitTest
      - name: Android lint
        run: gradle --no-daemon --max-workers=2 lintDebug
      - name: Build debug APK
        run: gradle --no-daemon --max-workers=2 assembleDebug
      - name: Upload RepoPilot APK
        uses: actions/upload-artifact@v4
        with:
          name: RepoPilot-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
